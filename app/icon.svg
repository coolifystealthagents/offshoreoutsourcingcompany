<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Offshore Outsourcing Company logo</title>
  <desc id="desc">A custom managed Philippines operations desk mark with a OOC wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102a2e"/>
      <stop offset="1" stop-color="#167c73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102a2e" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <rect x="20" y="24" width="56" height="48" rx="10" fill="#fff8ee" opacity=".98"/>
  <path d="M31 39h34M31 51h25M31 63h34" stroke="#167c73" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="30" r="9" fill="#f26b4f"/>
  <path d="M19 77h58" stroke="#f26b4f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">OOC</text>
</svg>
